# Webserver für jasonwolf.de (Container "jasonwolf-nginx", Datei /etc/nginx/conf.d/default.conf).
#
# Davor steht der Nginx Proxy Manager: Er beendet HTTPS, setzt die Sicherheits-Header und reicht alles hierher durch.
# Diese Datei liefert die statischen Seiten aus public/ und leitet /blog/ und /en/blog/ an den Blog-Dienst weiter.
# Einspielen: deploy/deploy.sh

# Dateien mit ?v=<Hash> ändern sich nie, alle anderen werden nach einer Stunde neu geprüft
map $arg_v $asset_cache {
    default "public, max-age=3600";
    ~.      "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Weiterleitungen ohne Hostnamen und Port ausgeben, sonst zeigen sie auf http://…:80 statt auf die öffentliche Adresse
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml
               application/atom+xml image/svg+xml;

    # Eine Adresse je Seite: www und index.html führen auf die Hauptadresse
    if ($host = www.jasonwolf.de) {
        return 301 https://jasonwolf.de$request_uri;
    }
    # (Prüfung an der angefragten Adresse, nicht per location: intern löst nginx "/" selbst zu /index.html auf)
    if ($request_uri ~ ^/(en/)?index\.html) {
        return 301 /$1;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control $asset_cache;
    }
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(jpg|png|webp|svg)$ {
        add_header Cache-Control "public, max-age=604800";
    }
    # Versteckte Dateien (.git, .env und ähnliche) gibt es nach außen nicht
    location ~ /\. {
        return 404;
    }

    # Blog: eigener Dienst auf dem Host, erreichbar nur über die Docker-Brücke.
    # ^~ gibt diesen Blöcken Vorrang vor den Regeln für .css, .js und Bilder weiter oben: Auch Stylesheet, Skript und
    # Medien des Blogs kommen vom Dienst, nicht aus dem Webverzeichnis.
    location ^~ /blog    { proxy_pass http://172.17.0.1:5941; }
    location ^~ /en/blog { proxy_pass http://172.17.0.1:5941; }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-Proto https;
    # Videos bis 500 MB werden direkt durchgereicht, nicht erst zwischengespeichert
    client_max_body_size 520m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
