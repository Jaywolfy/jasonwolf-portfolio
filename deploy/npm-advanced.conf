# Nginx Proxy Manager -> Hosts -> jasonwolf.de -> Edit -> Reiter "Advanced"
#
# Der Proxy Manager beendet HTTPS und reicht an den Container "jasonwolf-nginx" weiter. Hier stehen nur die
# Sicherheits-Header, weil sie für jede Antwort gelten sollen, auch für die des Blogs. Caching, Kompression,
# Fehlerseite und Weiterleitungen regelt deploy/nginx.conf.
#
# In dieses Feld gehören keine location-Blöcke und kein error_page: Beides hat die Seite am 09.09.2026 lahmgelegt.
# more_set_headers statt add_header, weil add_header in einem location-Block alle geerbten Header verwirft.
# HSTS setzt der Proxy Manager selbst (SSL-Reiter, "HSTS Enabled").

more_set_headers "X-Content-Type-Options: nosniff";
more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()";
more_set_headers "X-Frame-Options: DENY";

# Content Security Policy: Skripte nur vom eigenen Server und, nach Einwilligung, Google Analytics.
#   style-src 'unsafe-inline'  -> die Blog-Verwaltung setzt Balkenhöhen im Diagramm als style-Attribut
#   img-src data: blob:        -> QR-Code bei der Einrichtung, Vorschau beim Hochladen
#   connect-src formspree.io   -> das Kontaktformular sendet im Hintergrund
more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; media-src 'self' blob:; connect-src 'self' https://formspree.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";
