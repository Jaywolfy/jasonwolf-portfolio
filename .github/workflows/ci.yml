name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  website:
    name: Website bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/build.cjs
      - name: Skripte auf Syntaxfehler prüfen
        run: node --check public/assets/site.js && node --check blog/jwblog/static/admin.js

  blog:
    name: Blog testen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m unittest discover -s tests -t .
