[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jwblog"
version = "1.0.0"
description = "Blog mit Admin-Bereich für jasonwolf.de"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Jason Thomas Wolf" }]
dependencies = ["aiohttp>=3.9", "mistune>=3.0", "pillow>=10.0", "segno>=1.6"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["jwblog"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"jwblog/pages.py" = ["E501", "E731"]  # HTML in Textform
"jwblog/render.py" = ["E501"]
"jwblog/admin_pages.py" = ["E501"]  # HTML in Textform
"jwblog/web.py" = ["E501"]
"jwblog/store.py" = ["E501"]
"tests/*" = ["E501"]
